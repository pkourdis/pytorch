name: Apply open PRs onto intel/xccl2

on:
  workflow_dispatch:
    inputs:
      author:
        description: "GitHub user whose open pytorch/pytorch PRs are applied"
        default: madhumitha0102
        required: true
      target_branch:
        description: "Branch in this repo to overwrite with intel/xccl2 + the applied PRs"
        default: open_prs_on_xccl2
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_BRANCH: intel/xccl2
  TARGET_BRANCH: ${{ inputs.target_branch }}
  AUTHOR: ${{ inputs.author }}

jobs:
  apply:
    if: github.repository == 'pkourdis/pytorch'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          filter: blob:none
          # GITHUB_TOKEN cannot push commits that touch .github/workflows, so a PAT with `repo` + `workflow` scope is required.
          token: ${{ secrets.REBASE_TOKEN_MADHU }}

      - name: Apply PRs and push
        env:
          GH_TOKEN: ${{ secrets.REBASE_TOKEN_MADHU }}
        run: |
          set -euo pipefail
          case "${TARGET_BRANCH}" in
            "${BASE_BRANCH}"|main) echo "::error::Refusing to overwrite ${TARGET_BRANCH}."; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          upstream=https://github.com/pytorch/pytorch.git

          # Oldest PR first, so later PRs that build on earlier ones apply cleanly.
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=repo:pytorch/pytorch+is:pr+is:open+author:${AUTHOR}&sort=created&order=asc&per_page=100" \
            | python3 -c 'import json, sys; [print(i["number"], i["title"]) for i in json.load(sys.stdin)["items"]]' \
            > "${RUNNER_TEMP}/prs.txt"
          [ -s "${RUNNER_TEMP}/prs.txt" ] || { echo "No open PRs by ${AUTHOR}." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }

          git fetch --filter=blob:none "${upstream}" main
          upstream_main=$(git rev-parse FETCH_HEAD)

          echo -e "## Open PRs by ${AUTHOR} applied onto \`${BASE_BRANCH}\` ($(git rev-parse --short HEAD))\n" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          while read -r number title; do
            url="https://github.com/pytorch/pytorch/pull/${number}"
            git fetch "${upstream}" "refs/pull/${number}/head"
            head=$(git rev-parse FETCH_HEAD)
            # PR branches may contain merges of main; diffing from the merge-base with main isolates the PR's own changes.
            base=$(git merge-base "${upstream_main}" "${head}")
            if git diff --binary "${base}" "${head}" | git apply --3way --index; then
              git commit --quiet --author="$(git log -1 --format='%an <%ae>' "${head}")" -m "${title}" -m "Pull Request: ${url}"
              echo "- applied [#${number}](${url}) ${title}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::#${number} does not apply cleanly; skipped."
              {
                echo "- **skipped** [#${number}](${url}) ${title}: conflicts in"
                git diff --name-only --diff-filter=U | sed 's/^/  - `/; s/$/`/'
              } >> "$GITHUB_STEP_SUMMARY"
              git reset --quiet --hard HEAD
              failed=$((failed + 1))
            fi
          done < "${RUNNER_TEMP}/prs.txt"

          git push --force origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo -e "\nPushed $(git rev-parse HEAD) to \`${TARGET_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
          [ "${failed}" -eq 0 ] || { echo "::error::${failed} PR(s) were skipped due to conflicts."; exit 1; }
